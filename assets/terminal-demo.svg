<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --term-bg: #ffffff;
        --term-bar: #f6f8fa;
        --term-border: #d0d7de;
        --term-text: #1f2328;
        --term-dim: #656d76;
        --term-blue: #0969da;
        --term-purple: #8250df;
        --term-green: #1a7f37;
        --term-amber: #bf8700;
        --card-bg: #f6f8fa;
        --card-border: #d0d7de;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --term-bg: #0d1117;
          --term-bar: #161b22;
          --term-border: #30363d;
          --term-text: #f0f6fc;
          --term-dim: #8b949e;
          --term-blue: #38bdf8;
          --term-purple: #c084fc;
          --term-green: #34d399;
          --term-amber: #fbbf24;
          --card-bg: #161b22;
          --card-border: #30363d;
        }
      }

      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes subtlePulse {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 1; }
      }

      .term-cursor { animation: cursorBlink 0.9s steps(2, start) infinite; }
      .term-active { animation: subtlePulse 3s ease-in-out infinite; }

      text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
    </style>
  </defs>

  <!-- Terminal Window Shell -->
  <rect width="860" height="380" rx="10" fill="var(--term-bg)" stroke="var(--term-border)" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect width="860" height="34" rx="10" fill="var(--term-bar)"/>
  <rect width="860" height="1" y="34" fill="var(--term-border)"/>
  
  <!-- Window Controls -->
  <circle cx="20" cy="17" r="5" fill="#ef4444"/>
  <circle cx="36" cy="17" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="17" r="5" fill="#10b981"/>

  <!-- Title -->
  <text x="430" y="22" text-anchor="middle" fill="var(--term-dim)" font-size="11.5" font-weight="600">
    bash — python scripts/prefetch_topic.py --topic "Physics-Informed Neural Networks"
  </text>

  <!-- Terminal Content Body -->
  <g transform="translate(24, 60)">
    <!-- Command Prompt Line -->
    <text x="0" y="0" fill="var(--term-blue)" font-size="12" font-weight="700">user@research-node:~$</text>
    <text x="180" y="0" fill="var(--term-text)" font-size="12">python scripts/prefetch_topic.py --topic "PINNs" --size 60</text>

    <!-- Stage 1 -->
    <g transform="translate(0, 28)">
      <text x="0" y="0" fill="var(--term-dim)" font-size="11.5">[1/5]</text>
      <text x="45" y="0" fill="var(--term-blue)" font-size="11.5" font-weight="600">Ingestion:</text>
      <text x="145" y="0" fill="var(--term-text)" font-size="11.5">Fetched 60 papers (OpenAlex, arXiv, PubMed, S2)</text>
      <text x="680" y="0" fill="var(--term-green)" font-size="11.5" font-weight="600">✓ 60 Cached</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(0, 52)">
      <text x="0" y="0" fill="var(--term-dim)" font-size="11.5">[2/5]</text>
      <text x="45" y="0" fill="var(--term-purple)" font-size="11.5" font-weight="600">Clustering:</text>
      <text x="145" y="0" fill="var(--term-text)" font-size="11.5">Adaptive Silhouette Optimization (5 Methods, 5 Domains)</text>
      <text x="680" y="0" fill="var(--term-green)" font-size="11.5" font-weight="600">✓ Sil: 0.74</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(0, 76)">
      <text x="0" y="0" fill="var(--term-dim)" font-size="11.5">[3/5]</text>
      <text x="45" y="0" fill="var(--term-amber)" font-size="11.5" font-weight="600">2D Matrix:</text>
      <text x="145" y="0" fill="var(--term-text)" font-size="11.5">Mapped 5x5 density grid; detected 4 structural voids</text>
      <text x="680" y="0" fill="var(--term-green)" font-size="11.5" font-weight="600">✓ 4 Voids</text>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(0, 100)">
      <text x="0" y="0" fill="var(--term-dim)" font-size="11.5">[4/5]</text>
      <text x="45" y="0" fill="var(--term-purple)" font-size="11.5" font-weight="600">Devil's Adv:</text>
      <text x="145" y="0" fill="var(--term-text)" font-size="11.5">5-Pillar failure challenge on candidate gap cells</text>
      <text x="680" y="0" fill="var(--term-green)" font-size="11.5" font-weight="600">✓ 5/5 Pass</text>
    </g>

    <!-- Stage 5 -->
    <g transform="translate(0, 124)">
      <text x="0" y="0" fill="var(--term-dim)" font-size="11.5">[5/5]</text>
      <text x="45" y="0" fill="var(--term-green)" font-size="11.5" font-weight="600">Synthesis:</text>
      <text x="145" y="0" fill="var(--term-text)" font-size="11.5">Compiled Dossiers, H1/H0 Hypotheses &amp; IEEE LaTeX</text>
      <text x="680" y="0" fill="var(--term-green)" font-size="11.5" font-weight="600">✓ Ready</text>
    </g>

    <!-- Result Summary Box -->
    <g transform="translate(0, 146)">
      <rect width="812" height="110" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.2"/>
      
      <!-- Banner in Card -->
      <rect width="812" height="24" rx="8" fill="var(--card-border)" opacity="0.4"/>
      <text x="14" y="16" fill="var(--term-amber)" font-size="10.5" font-weight="700">★ TOP VALIDATED GAP: Adaptive Collocation in Boundary Turbulence</text>
      <text x="660" y="16" fill="var(--term-green)" font-size="10.5" font-weight="700">STATUS: TRUE GAP</text>

      <text x="14" y="44" fill="var(--term-text)" font-size="11">
        Confidence: <tspan fill="var(--term-green)" font-weight="700">88.4%</tspan>  |  
        Signal: <tspan fill="var(--term-blue)">Repeated Limitations (4 Papers)</tspan>  |  
        Feasibility: <tspan fill="var(--term-purple)">82.1%</tspan>  |  
        Novelty: <tspan fill="var(--term-green)">88.0%</tspan>
      </text>

      <text x="14" y="68" fill="var(--term-dim)" font-size="10.5">
        H1 Hypothesis: Collocation refinement reduces Navier-Stokes boundary gradient MSE by &gt;32%.
      </text>

      <text x="14" y="92" fill="var(--term-dim)" font-size="10">
        Exported: <tspan fill="var(--term-blue)">dossier.tex</tspan> (IEEE format)  •  <tspan fill="var(--term-blue)">matrix_heatmap.json</tspan>  •  <tspan fill="var(--term-blue)">evidence_graph.html</tspan>
      </text>
    </g>

    <!-- Final Active Command Prompt -->
    <g transform="translate(0, 278)">
      <text x="0" y="0" fill="var(--term-blue)" font-size="12" font-weight="700">user@research-node:~$</text>
      <text x="180" y="0" fill="var(--term-text)" font-size="12">streamlit run src/ui/app.py --server.port=8501</text>
      <rect x="585" y="-11" width="8" height="14" fill="var(--term-blue)" class="term-cursor"/>
    </g>
  </g>
</svg>
