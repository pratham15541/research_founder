[project]
name = "research-ai-agent"
version = "0.1.0"
description = "Research Landscape, Combinatorial Gap Matrix & Knowledge Graph Tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "boto3>=1.34.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.115.0",
    "hdbscan>=0.8.38",
    "httpx>=0.27.0",
    "opensearch-py>=2.6.0",
    "langchain>=0.2.14",
    "langchain-core>=0.2.35",
    "langchain-google-genai>=1.0.8",
    "langgraph>=0.2.20",
    "networkx>=3.3",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pdfplumber>=0.11.4",
    "pgvector>=0.3.2",
    "plotly>=5.24.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.8.2,<3.0.0",
    "pydantic-settings>=2.4.0",
    "pymupdf>=1.24.9",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "pyvis>=0.3.2",
    "requests>=2.31.0",
    "scikit-learn>=1.5.1",
    "sentence-transformers>=3.0.1",
    "sqlalchemy>=2.0.32",
    "streamlit>=1.38.0",
    "torch>=2.4.0",
    "tqdm>=4.66.5",
    "umap-learn>=0.5.6",
    "uvicorn[standard]>=0.30.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

